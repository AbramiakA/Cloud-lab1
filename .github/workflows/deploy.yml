name: deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Debug OIDC sub
              run: |
                TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
                echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .sub

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: eu-north-1

            - uses: aws-actions/amazon-ecr-login@v2
              id: ecr

            - name: Build and push image
              run: |
                docker build --platform linux/amd64 \
                    -t $ECR/lab1-app:${{ github.sha }} \
                    -t $ECR/lab1-app:latest .
                docker push --all-tags $ECR/lab1-app
              env:
                ECR: ${{ steps.ecr.outputs.registry }}

            - name: Download task definition
              run: |
                aws ecs describe-task-definition \
                    --task-definition lab1-app \
                    --query taskDefinition > task-definition.json

            - name: Update image in task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                task-definition: task-definition.json
                container-name: app
                image: ${{ steps.ecr.outputs.registry }}/lab1-app:${{ github.sha }}

            - name: Deploy to ECS
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.task-def.outputs.task-definition }}
                service: lab1-service
                cluster: lab1-cluster
                wait-for-service-stability: true